# ============================================================================
# Nginx vhost for Bulawayo Polytechnic Institutional Repository
# Domain:   %%IR_HOSTNAME%%
# Backend:  Tomcat REST API on %%TOMCAT_PORT%%
# Frontend: Node.js Angular UI on %%UI_PORT%%
#
# Certbot will add the HTTPS block automatically when 07-nginx.sh runs.
# If you add SSL manually, replace the HTTP blocks with the example below.
# ============================================================================

# ── HTTP — redirect all to HTTPS ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name %%IR_HOSTNAME%%;

    # Used by certbot for domain validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
# Certbot fills in ssl_certificate and ssl_certificate_key.
# Uncomment and adjust manually if you manage certificates yourself.
#
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name %%IR_HOSTNAME%%;

    # ── SSL — managed by certbot ──────────────────────────────────────────────
    # ssl_certificate     /etc/letsencrypt/live/%%IR_HOSTNAME%%/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/%%IR_HOSTNAME%%/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Self-signed (use until Let's Encrypt is ready) ────────────────────────
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # ── TLS hardening ─────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDH+AESGCM:ECDH+AES256:ECDH+AES128:!3DES:!aNULL:!MD5;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 8.8.4.4 valid=300s;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                             always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header X-XSS-Protection          "1; mode=block"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_types       text/plain text/css text/xml text/javascript
                     application/json application/javascript application/xml
                     application/rss+xml image/svg+xml;

    # ── Request size limit (for file uploads) ─────────────────────────────────
    client_max_body_size  512M;

    # ── Proxy timeouts ────────────────────────────────────────────────────────
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Port   $server_port;
    proxy_http_version 1.1;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         keep-alive;
    proxy_cache_bypass                  $http_upgrade;

    # ── DSpace REST API (Tomcat) ───────────────────────────────────────────────
    # All /server/* requests go to the Spring Boot REST API
    location /server {
        proxy_pass http://127.0.0.1:%%TOMCAT_PORT%%/server;

        # Disable buffering for streaming responses (e.g. large file downloads)
        proxy_buffering off;

        # CORS is handled by DSpace — do not add headers here
    }

    # ── DSpace Angular UI (Node.js SSR) ───────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:%%UI_PORT%%;

        # Static assets — cache aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            proxy_pass http://127.0.0.1:%%UI_PORT%%;
            expires    7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── Robots.txt ────────────────────────────────────────────────────────────
    location = /robots.txt {
        root /var/www/html;
        try_files $uri @robots_default;
    }
    location @robots_default {
        return 200 "User-agent: *\nAllow: /\n";
        add_header Content-Type text/plain;
    }

    # ── Deny .hidden paths ────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
