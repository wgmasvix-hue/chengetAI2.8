##############################################################################
# DSpace 7.6 — local.cfg for Bulawayo Polytechnic Institutional Repository
# Placeholders (%%VAR%%) are substituted by 04-build.sh at install time
##############################################################################

# ── Installation Path ─────────────────────────────────────────────────────────
dspace.dir = %%DSPACE_DIR%%

# ── Public URLs ───────────────────────────────────────────────────────────────
# REST API (Tomcat backend)
dspace.server.url = https://%%IR_HOSTNAME%%/server
# Angular UI (Node.js frontend)
dspace.ui.url     = https://%%IR_HOSTNAME%%
# Internal hostname
dspace.hostname   = %%IR_HOSTNAME%%

# ── Repository Identity ───────────────────────────────────────────────────────
dspace.name           = %%INSTITUTION_NAME%% Institutional Repository
dspace.shortname      = %%INSTITUTION_SHORT%% IR

# ── Database ──────────────────────────────────────────────────────────────────
db.url        = jdbc:postgresql://%%DB_HOST%%:%%DB_PORT%%/%%DB_NAME%%
db.username   = %%DB_USER%%
db.password   = %%DB_PASSWORD%%
db.schema     = public
db.poolname   = dspacepool
db.maxidle    = 10
db.maxactive  = 30
db.maxwait    = 5000

# ── Search / Solr ─────────────────────────────────────────────────────────────
solr.server   = http://localhost:%%SOLR_PORT%%/solr

# ── Handle Server ─────────────────────────────────────────────────────────────
handle.canonical.prefix   = https://%%IR_HOSTNAME%%/handle/
handle.prefix             = %%HANDLE_PREFIX%%
handle.hide.listhandles   = false

# ── Asset Storage ─────────────────────────────────────────────────────────────
assetstore.dir                    = ${dspace.dir}/assetstore
# Keep up to 4 GB in a single assetstore
assetstore.maxfiles               = 0

# ── Mail ──────────────────────────────────────────────────────────────────────
mail.server                       = %%MAIL_SERVER%%
mail.server.port                  = %%MAIL_PORT%%
mail.from.address                 = %%MAIL_FROM%%
mail.feedback.recipient           = %%ADMIN_EMAIL%%
mail.admin                        = %%ADMIN_EMAIL%%
mail.alert.recipient              = %%MAIL_ALERT%%
mail.registration.notify          = %%ADMIN_EMAIL%%

# ── Authentication ────────────────────────────────────────────────────────────
plugin.sequence.org.dspace.authenticate.AuthenticationMethod = \
  org.dspace.authenticate.PasswordAuthentication, \
  org.dspace.authenticate.ShibAuthentication

authentication-password.domain.valid = %%IR_HOSTNAME:bpoly.ac.zw%%

# Allow registration by anyone with a @bpoly.ac.zw email
authentication-password.self-registered-group = Anonymous

# ── CORS (Angular UI origin) ──────────────────────────────────────────────────
rest.cors.allowed-origins         = https://%%IR_HOSTNAME%%

# ── OAI-PMH ──────────────────────────────────────────────────────────────────
oai.url         = https://%%IR_HOSTNAME%%/server/oai/request
oai.index.url   = https://%%IR_HOSTNAME%%/server/oai/request

# ── Statistics ────────────────────────────────────────────────────────────────
solr.statistics.enabled              = true
statistics.item.transformer          = DSpaceObjectTransformer
statistics.item.dc.type              = dc.type

# ── Usage Stats Bot Filtering ─────────────────────────────────────────────────
# Suppress well-known crawler IPs from stats
useProxies                           = true
proxies.trusted.ipranges             =

# ── Browse Indices ────────────────────────────────────────────────────────────
webui.browse.index.1  = dateissued:item:dateissued
webui.browse.index.2  = author:metadata:dc.contributor.*,dc.creator:text
webui.browse.index.3  = title:item:title
webui.browse.index.4  = subject:metadata:dc.subject.*:text
webui.browse.index.5  = type:metadata:dc.type:text
webui.browse.index.6  = department:metadata:dc.description.department:text

# ── Submission Metadata ───────────────────────────────────────────────────────
webui.submit.upload.required = true
webui.submit.upload.max      = 536870912

# ── Item display ─────────────────────────────────────────────────────────────
# Show DOI as a link on item pages
webui.resolver.1.urn = doi
webui.resolver.1.baseuri = https://doi.org/

# ── Thumbnail generation ──────────────────────────────────────────────────────
filter.plugins        = PDF Text Extractor, HTML Text Extractor, \
                        Word Text Extractor, PowerPoint Text Extractor, \
                        JPEG Thumbnail, PDF Thumbnail
thumbnail.maxwidth    = 200
thumbnail.maxheight   = 200

# ── Licence ───────────────────────────────────────────────────────────────────
webui.submit.license_text = \
  By submitting this item, you grant Bulawayo Polytechnic Library \
  a non-exclusive right to preserve, archive and make available this \
  work for educational and research purposes.

# ── UI / Application ──────────────────────────────────────────────────────────
xmlui.supported.locales = en

# ── Sitemaps ──────────────────────────────────────────────────────────────────
sitemap.dir = ${dspace.dir}/sitemaps

# ── Embargo ───────────────────────────────────────────────────────────────────
embargo.field.terms = dc.date.embargo
embargo.field.lift  = dc.date.available
